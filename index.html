 <!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MSTC Data Vault</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:#070b16;
  color:white;
}

.app{
  max-width:480px;
  min-height:100vh;
  margin:auto;
  background:#0b1020;
  padding-bottom:30px;
}

/* TOP */

.top{
  padding:25px 20px 20px;
  background:linear-gradient(145deg,#111a38,#172b68);
  border-radius:0 0 30px 30px;
}

.brand{
  display:flex;
  align-items:center;
  gap:13px;
}

.logo{
  width:52px;
  height:52px;
  border-radius:15px;
  background:linear-gradient(135deg,#4f8cff,#7c3aed);
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:24px;
  font-weight:bold;
}

.brand h1{
  font-size:21px;
}

.brand p{
  color:#aeb9d6;
  font-size:12px;
  margin-top:4px;
}

/* STATUS */

.statusbar{
  margin-top:22px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:rgba(255,255,255,.08);
  padding:12px 14px;
  border-radius:13px;
  font-size:12px;
}

.online{
  color:#4ade80;
}

/* CONTENT */

.content{
  padding:18px;
}

.card{
  background:#11182b;
  border:1px solid #1d2945;
  border-radius:20px;
  padding:18px;
  margin-bottom:16px;
  box-shadow:0 10px 25px rgba(0,0,0,.25);
}

.card-title{
  font-size:16px;
  font-weight:bold;
  margin-bottom:15px;
}

/* WALLET */

.wallet{
  background:#0b1224;
  border-radius:14px;
  padding:14px;
  color:#9ca9c7;
  font-size:12px;
  word-break:break-all;
}

.connect{
  width:100%;
  border:0;
  padding:14px;
  border-radius:13px;
  margin-bottom:10px;
  background:#2563eb;
  color:white;
  font-size:15px;
  font-weight:bold;
}

/* DATA */

textarea{
  width:100%;
  height:145px;
  border:1px solid #293653;
  border-radius:15px;
  background:#080e1d;
  color:white;
  padding:15px;
  resize:none;
  outline:none;
  font-size:14px;
}

textarea::placeholder{
  color:#68758f;
}

textarea:focus{
  border-color:#4f8cff;
}

.save{
  width:100%;
  margin-top:13px;
  border:0;
  border-radius:14px;
  padding:16px;
  background:linear-gradient(135deg,#2563eb,#7c3aed);
  color:white;
  font-size:16px;
  font-weight:bold;
}

/* INFO */

.info{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.infoBox{
  background:#0b1224;
  padding:14px;
  border-radius:14px;
}

.label{
  font-size:11px;
  color:#7f8ba6;
}

.value{
  margin-top:6px;
  font-size:14px;
  font-weight:bold;
}

/* VERIFY */

.verify{
  width:100%;
  border:1px solid #314267;
  background:#111d35;
  color:#8db5ff;
  padding:14px;
  border-radius:13px;
  font-weight:bold;
}

.result{
  margin-top:12px;
  background:#080e1d;
  padding:14px;
  border-radius:13px;
  color:#aeb9d6;
  font-size:12px;
  word-break:break-all;
}

/* FOOTER */

.footer{
  text-align:center;
  color:#596681;
  font-size:11px;
  padding:10px;
}

</style>
</head>

<body>

<div class="app">

<!-- HEADER -->

<div class="top">

  <div class="brand">

    <div class="logo">M</div>

    <div>
      <h1>MSTC Data Vault</h1>
      <p>AJJRA Blockchain Technology</p>
    </div>

  </div>

  <div class="statusbar">

    <span>● MSTC Testnet</span>

    <span class="online">
      ● ONLINE
    </span>

  </div>

</div>


<div class="content">


<!-- WALLET -->

<div class="card">

  <div class="card-title">
    👛 Wallet Connection
  </div>

  <button
    class="connect"
    onclick="connectWallet()">

    Connect MSTC Wallet

  </button>

  <div
    id="wallet"
    class="wallet">

    Wallet not connected

  </div>

</div>


<!-- DATA -->

<div class="card">

  <div class="card-title">
    🔐 Secure Data Storage
  </div>

  <textarea
    id="data"
    placeholder="Enter the information you want to secure...">
  </textarea>

  <button
    class="save"
    onclick="saveData()">

    🚀 SAVE TO MSTC

  </button>

</div>


<!-- BLOCKCHAIN INFO -->

<div class="card">

  <div class="card-title">
    ⛓ Blockchain Status
  </div>

  <div class="info">

    <div class="infoBox">

      <div class="label">
        NETWORK
      </div>

      <div class="value">
        MST Testnet
      </div>

    </div>

    <div class="infoBox">

      <div class="label">
        SECURITY
      </div>

      <div class="value">
        SHA-256
      </div>

    </div>

  </div>

</div>


<!-- VERIFY -->

<div class="card">

  <div class="card-title">
    🔎 Verify Data
  </div>

  <button
    class="verify"
    onclick="verifyData()">

    Verify Blockchain Data

  </button>

  <div
    id="result"
    class="result">

    No transaction yet.

  </div>

</div>


</div>


<div class="footer">

  MSTC Blockchain • AJJRA Technology • Data Vault

</div>

</div>


<script>

let walletAddress = "";
let savedHash = "";


/* WALLET */

async function connectWallet(){

  if(!window.ethereum){

    alert(
      "Please open this app using a Web3 compatible wallet."
    );

    return;

  }

  try{

    const accounts =
      await window.ethereum.request({
        method:"eth_requestAccounts"
      });

    walletAddress = accounts[0];

    document.getElementById("wallet").innerText =
      "Connected\n" + walletAddress;

  }

  catch(error){

    alert("Wallet connection cancelled.");

  }

}


/* HASH */

async function createHash(text){

  const bytes =
    new TextEncoder().encode(text);

  const buffer =
    await crypto.subtle.digest(
      "SHA-256",
      bytes
    );

  return Array.from(
    new Uint8Array(buffer)
  )
  .map(
    b => b.toString(16).padStart(2,"0")
  )
  .join("");

}


/* SAVE */

async function saveData(){

  const text =
    document.getElementById("data").value.trim();

  if(!text){

    alert("Please enter data.");

    return;

  }

  savedHash =
    await createHash(text);

  document.getElementById("result").innerHTML =

    "✅ Data prepared<br><br>" +

    "<b>SHA-256:</b><br>" +

    savedHash +

    "<br><br>" +

    "⏳ Ready for MSTC Testnet transaction";

}


/* VERIFY */

async function verifyData(){

  const text =
    document.getElementById("data").value.trim();

  if(!text){

    alert("Enter data first.");

    return;

  }

  const hash =
    await createHash(text);

  if(hash === savedHash){

    document.getElementById("result").innerHTML =

      "✅ <b>DATA VERIFIED</b><br><br>" +

      "Hash matches the saved record.";

  }

  else{

    document.getElementById("result").innerHTML =

      "❌ <b>DATA NOT MATCHED</b>";

  }

}

</script>

</body>
</html>
