 <!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MSTC Data App</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#eef2f7;
  color:#172033;
}

.app{
  max-width:480px;
  min-height:100vh;
  margin:auto;
  background:#fff;
}

.header{
  background:linear-gradient(135deg,#111827,#2563eb);
  color:white;
  padding:28px 22px;
  border-radius:0 0 30px 30px;
}

.logo{
  width:58px;
  height:58px;
  background:white;
  color:#2563eb;
  border-radius:16px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:25px;
  font-weight:bold;
  margin-bottom:14px;
}

.header h1{
  margin:0;
  font-size:27px;
}

.header p{
  margin:8px 0 0;
  opacity:.85;
}

.content{
  padding:20px;
}

.card{
  background:#fff;
  border-radius:18px;
  padding:18px;
  margin-bottom:16px;
  box-shadow:0 5px 18px rgba(0,0,0,.08);
}

.title{
  font-size:17px;
  font-weight:bold;
  margin-bottom:12px;
}

textarea{
  width:100%;
  height:150px;
  resize:none;
  padding:14px;
  border:1px solid #d5dbe5;
  border-radius:14px;
  font-size:16px;
  outline:none;
}

textarea:focus{
  border-color:#2563eb;
}

button{
  width:100%;
  border:0;
  border-radius:13px;
  padding:15px;
  margin-top:12px;
  font-size:16px;
  font-weight:bold;
}

.connect{
  background:#111827;
  color:white;
}

.save{
  background:#2563eb;
  color:white;
}

.verify{
  background:#e7efff;
  color:#1d4ed8;
}

.status{
  margin-top:12px;
  padding:13px;
  background:#f1f5f9;
  border-radius:12px;
  font-size:13px;
  word-break:break-all;
}

.wallet{
  margin-top:10px;
  font-size:12px;
  color:#64748b;
  word-break:break-all;
}

.footer{
  text-align:center;
  padding:25px;
  color:#64748b;
  font-size:12px;
}
</style>
</head>

<body>

<div class="app">

  <div class="header">
    <div class="logo">M</div>
    <h1>MSTC Data App</h1>
    <p>Secure Blockchain Data Storage</p>
  </div>

  <div class="content">

    <div class="card">
      <div class="title">👛 Wallet</div>

      <button class="connect" onclick="connectWallet()">
        Connect MSTC Wallet
      </button>

      <div id="wallet" class="wallet">
        Wallet not connected
      </div>
    </div>

    <div class="card">
      <div class="title">📝 Store Data</div>

      <textarea id="data"
        placeholder="Enter your data here..."></textarea>

      <button class="save" onclick="saveData()">
        💾 Save to MSTC
      </button>
    </div>

    <div class="card">
      <div class="title">🔍 Verify</div>

      <button class="verify" onclick="verifyData()">
        Verify Data
      </button>

      <div id="result" class="status">
        No data saved yet.
      </div>
    </div>

  </div>

  <div class="footer">
    MSTC Blockchain • AJJRA Technology
  </div>

</div>

<script>

let walletAddress = "";
let savedHash = "";

/* WALLET */

async function connectWallet(){

  if(!window.ethereum){
    alert("Open this website in a Web3 wallet browser.");
    return;
  }

  try{

    const accounts =
      await window.ethereum.request({
        method:"eth_requestAccounts"
      });

    walletAddress = accounts[0];

    document.getElementById("wallet").innerText =
      "Connected: " + walletAddress;

  }catch(error){

    alert("Wallet connection cancelled.");

  }
}


/* HASH */

async function makeHash(text){

  const data =
    new TextEncoder().encode(text);

  const buffer =
    await crypto.subtle.digest("SHA-256",data);

  return Array.from(
    new Uint8Array(buffer)
  ).map(
    b => b.toString(16).padStart(2,"0")
  ).join("");
}


/* SAVE */

async function saveData(){

  const text =
    document.getElementById("data").value.trim();

  if(!text){
    alert("Please enter data.");
    return;
  }

  savedHash = await makeHash(text);

  document.getElementById("result").innerHTML =
    "<b>✅ Data Ready</b><br><br>" +
    "SHA-256 Hash:<br>" +
    savedHash +
    "<br><br>" +
    "Status: Ready for MSTC Testnet";

}


/* VERIFY */

async function verifyData(){

  const text =
    document.getElementById("data").value.trim();

  if(!text){
    alert("Enter data first.");
    return;
  }

  const hash = await makeHash(text);

  if(hash === savedHash){

    document.getElementById("result").innerHTML =
      "<b>✅ Data Verified</b><br><br>" +
      "Hash matches.";

  }else{

    document.getElementById("result").innerHTML =
      "<b>❌ Data Not Matched</b>";

  }
}

</script>

</body>
</html>
